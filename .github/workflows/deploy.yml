name: Publish website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Privacy check (no patient or private information)
        run: python3 tools/privacy_check.py dist
      - name: Site check (pages, links, sitemaps)
        run: pip install --quiet pillow && python3 scripts/validate-release.py
      - name: Build site folder (social media files stay in the repo, not on the website)
        run: cp -a dist _site && rm -rf _site/social
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
